<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genètica en joc 🧬</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2d42;--a:#6c5ce7;--b:#00b894;--c:#ff7675;--d:#fdcb6e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);text-align:center}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--a);color:#fff;font-weight:700;font-size:1.1rem}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.8rem;margin:.3em 0}
.btn{display:block;width:100%;margin:12px 0;padding:18px;font-size:1.25rem;font-weight:700;border:0;border-radius:18px;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.b1{background:var(--a)}.b2{background:var(--b)}.b3{background:var(--c)}.b4{background:#636e72;font-size:1rem;padding:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.card{min-height:96px;border-radius:14px;border:0;background:var(--a);color:#fff;font-size:2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;transition:transform .2s}
.card.open{background:var(--card);color:var(--ink);border:3px solid var(--a)}
.card.ok{background:#d5f5e3;border:3px solid var(--b);color:var(--ink)}
.card small{font-size:.85rem;line-height:1.15;font-weight:600}
.card .t{display:flex;flex-direction:column;gap:2px}
.q{background:var(--card);border-radius:18px;padding:18px;font-size:1.3rem;font-weight:700;margin:12px 0;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.opt{background:#fff;border:3px solid #dfe6e9;color:var(--ink)}
.opt.good{background:#d5f5e3;border-color:var(--b)}.opt.bad{background:#fadbd8;border-color:var(--c)}
.msg{min-height:3.2em;font-size:1.1rem;font-weight:600;margin:8px 0}
.bar{height:12px;background:#dfe6e9;border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--b);width:0;transition:width .3s}
.big{font-size:3.5rem;margin:8px}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fx span{position:absolute;top:-40px;font-size:2rem;animation:f 2s linear forwards}
@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<header><span>🧬 Genètica en joc</span><span id="pts">⭐ 0</span></header>
<main id="app"></main>
<div class="fx" id="fx"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
let pts=0;try{pts=+localStorage.getItem('gen_pts')||0}catch(e){}
function add(n){pts+=n;$('#pts').textContent='⭐ '+pts;try{localStorage.setItem('gen_pts',pts)}catch(e){}}
add(0);
const good=['Molt bé! 🎉','Crack! 💪','Genial! 🌟','Quina memòria! 🧠','Imparable! 🚀','Això és! 👏','Brutal! 🔥'];
const retry=['Gairebé! Cada error t\'ajuda a aprendre 💜','Cap problema, ara ja ho saps 😉','Els cracks també s\'equivoquen. Endavant! 💪','Bon intent! La propera cau 🍀'];
const praiseEnd=['Has fet una ronda sencera. Ets un/a campió/ona! 🏆','Tria: repetir o fer una pausa de 2 minuts 🧃','El teu cervell ha crescut una mica avui 🧠✨'];
function confetti(){const f=$('#fx');for(let i=0;i<24;i++){const s=document.createElement('span');s.textContent=rnd(['🎉','⭐','🧬','✨','🌟']);s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.6+'s';f.appendChild(s);setTimeout(()=>s.remove(),2800)}}
function home(){app.innerHTML=`<h1>Què juguem avui?</h1><p>Rondes curtes: 3-5 minuts. Cada encert suma estrelles ⭐</p>
<button class="btn b1" onclick="memSel()">🃏 Memori</button>
<button class="btn b2" onclick="quiz()">❓ Repte de preguntes</button>
<button class="btn b3" onclick="vf()">✅❌ Veritat o fals</button>`}
function end(stars,extra){confetti();app.innerHTML=`<div class="big">${'⭐'.repeat(stars)}</div><h1>${rnd(good)}</h1><p>${extra||''}</p><p>${rnd(praiseEnd)}</p><button class="btn b1" onclick="home()">Tornar a l'inici</button>`}

/* MEMORI */
const SETS={
'🧬 Conceptes':[['🧬 Gen','Fragment d\'ADN amb informació d\'un caràcter'],['🔀 Al·lel','Cada versió d\'un gen'],['👁️ Fenotip','El que es veu: l\'aspecte'],['🧪 Genotip','Els al·lels que tens (ex: Aa)'],['💪 Dominant','Es nota sempre'],['😶 Recessiu','Només si en tens dos (aa)']],
'🩺 Malalties':[['🦄 Albinisme','Recessiu. Falta melanina'],['🫁 Fibrosi quística','Recessiva. Mucus als pulmons'],['💃 Huntington','Dominant. Ball de Sant Vito'],['✋ Polidactília','Dominant. Més dits'],['🎨 Daltonisme','Recessiu lligat a X. Verd/vermell'],['🩸 Hemofília','Recessiva lligada a X. Coagulació']],
'🅰️ Sang i sexe':[['🅰️ Grup A','Antigen A i anticòs anti-B'],['🅱️ Grup B','Antigen B i anticòs anti-A'],['🆎 Grup AB','Antígens A i B. Cap anticòs'],['⭕ Grup O','Cap antigen. Anti-A i anti-B'],['🤝 IAIB','Codominància: grup AB'],['👦👧 XY / XX','Home: XY. Dona: XX']]};
function memSel(){app.innerHTML='<h1>Tria un tema</h1>'+Object.keys(SETS).map((k,i)=>`<button class="btn b${i+1}" onclick="mem('${k}')">${k}</button>`).join('')+'<button class="btn b4" onclick="home()">⬅ Inici</button>'}
function mem(k){
 const cards=shuf(SETS[k].flatMap((p,i)=>[{id:i,h:`<span class="t"><span>${p[0].split(' ')[0]}</span><small>${p[0].split(' ').slice(1).join(' ')}</small></span>`},{id:i,h:`<small>${p[1]}</small>`}]));
 let first=null,lock=false,moves=0,found=0;
 app.innerHTML=`<h2>${k}</h2><p>Troba cada terme amb la seva definició</p><div class="bar"><i id="pb"></i></div><div class="grid" id="g"></div><div class="msg" id="m"></div><button class="btn b4" onclick="memSel()">⬅ Temes</button>`;
 const g=$('#g');
 cards.forEach(c=>{const b=document.createElement('button');b.className='card';b.textContent='❔';b.onclick=()=>{
  if(lock||b.classList.contains('open')||b.classList.contains('ok'))return;
  b.classList.add('open');b.innerHTML=c.h;
  if(!first){first={c,b};return}
  moves++;
  if(first.c.id===c.id){first.b.classList.add('ok');b.classList.add('ok');first=null;found++;add(10);$('#m').textContent=rnd(good);$('#pb').style.width=found/6*100+'%';
   if(found===6)setTimeout(()=>end(moves<=9?3:moves<=14?2:1,`Ho has fet en ${moves} intents`),600)}
  else{lock=true;$('#m').textContent=rnd(retry);const f=first;first=null;setTimeout(()=>{[f.b,b].forEach(x=>{x.classList.remove('open');x.textContent='❔'});lock=false},1100)}
 };g.appendChild(b)})}

/* PREGUNTES */
const Q=[
['Quina planta va fer servir Mendel?',['Pèsol','Tomaquera','Blat'],0,'El pèsol creix ràpid i és fàcil de creuar 🌱'],
['Un al·lel recessiu només es nota si tens…',['Un al·lel','Dos al·lels iguals (aa)','Cap al·lel'],1,'Recessiu = necessita dues còpies.'],
['El genotip Aa és…',['Homozigòtic','Heterozigòtic','Híbrid de sexe'],1,'Dos al·lels diferents = heterozigòtic.'],
['Primera llei: creues dues races pures. La F1 és…',['Tota uniforme','Meitat i meitat','Impossible de saber'],0,'Llei de la uniformitat dels híbrids.'],
['Quin és el genotip d\'una dona portadora d\'hemofília?',['XhXh','XHXh','XHY'],1,'Té un al·lel normal i un d\'hemofília.'],
['Una dona daltoniana té genotip…',['XdXd','XDXd','XdY'],0,'Ha de tenir dos al·lels d.'],
['Quin grup sanguini té genotip IAIB?',['A','O','AB'],2,'IA i IB són codominants: apareixen tots dos.'],
['Quin és el genotip del grup O?',['ii','IAi','IBIB'],0,'O és recessiu: ii.'],
['Probabilitat de tenir un fill o una filla?',['25%','50%','75%'],1,'50% fills i 50% filles.'],
['La malaltia de Huntington és…',['Recessiva','Dominant','Lligada a X'],1,'Dominant: amb un sol al·lel H ja apareix.'],
['L\'albinisme afecta a la síntesi de…',['Colesterol','Melanina','Hemoglobina'],1,'La melanina dóna color a pell, ulls i pèl.'],
['Codominància vol dir que l\'heterozigot…',['Barreja els al·lels','Mostra els dos al·lels','Mostra només un'],1,'Com les vaques ruanes 🐄'],
['Tercera llei: els caràcters no antagònics s\'hereten…',['Junts sempre','De manera independent','Només per via materna'],1,'Color i textura del pèsol són independents.'],
['Quan és perillós el factor Rh?',['Mare Rh+ i fill Rh-','Mare Rh- i fill Rh+ (2n embaràs)','Mai'],1,'Per això hi ha una injecció preventiva 💉'],
['A la segona llei, els al·lels es separen als…',['Gàmetes','Ronyons','Cromosomes X'],0,'Segregació dels al·lels als gàmetes.'],
['Quins anticossos té el grup AB?',['Anti-A','Anti-B','Cap']
,2,'Té els dos antígens, així que no fabrica anticossos.']];
const V=[
['Els homes tenen cromosomes XX.',1,'Home XY, dona XX.'],['L\'albinisme és una malaltia dominant.',1,'És recessiva.'],['Huntington és causada per un al·lel dominant.',0,'Correcte, es manifesta entre els 30 i 50 anys.'],
['El grup O té antigen A.',1,'El grup O no té cap antigen.'],['IA i IB són codominants.',0,'Sí, per això hi ha el grup AB.'],['Hi ha un 50% de probabilitat de tenir filla.',0,'Un 50% fills i 50% filles.'],
['Una dona XhXh és hemofílica.',0,'Té dos al·lels recessius.'],['Mendel va fer servir pèsols.',0,'Sí! 🌱'],['El Rh positiu és recessiu.',1,'El positiu és dominant.'],
['La polidactília dóna més dits i és dominant.',0,'Exacte ✋'],['Mendel va estudiar 7 caràcters del pèsol.',0,'Sí, d\'1 o 2 en cada creuament.'],['El daltonisme és dominant.',1,'És recessiu i lligat a X.']].map(v=>[v[0],['Veritat ✅','Fals ❌'],v[1],v[2]]);
function quiz(){run(shuf(Q).slice(0,6))}
function vf(){run(shuf(V).slice(0,8))}
function run(list){
 let i=0,ok=0,streak=0;
 function show(){
  const [q,o,a,e]=list[i];let done=false;
  app.innerHTML=`<div class="bar"><i style="width:${i/list.length*100}%"></i></div><p>Pregunta ${i+1} de ${list.length} · 🔥 ${streak}</p><div class="q">${q}</div><div id="o"></div><div class="msg" id="m"></div><div id="n"></div>`;
  o.map((t,k)=>[t,k]).forEach(([t,k])=>{const b=document.createElement('button');b.className='btn opt';b.textContent=t;b.onclick=()=>{
   if(done)return;done=true;
   if(k===a){b.classList.add('good');ok++;streak++;add(10+(streak>=3?5:0));$('#m').textContent=rnd(good)+(streak>=3?' Ratxa x'+streak+'!':'')+' '+e}
   else{b.classList.add('bad');streak=0;[...$('#o').children][a].classList.add('good');$('#m').textContent=rnd(retry)+' '+e}
   const n=document.createElement('button');n.className='btn b1';n.textContent=i+1<list.length?'Següent ➡':'Veure resultat 🏁';n.onclick=()=>{i++;i<list.length?show():end(ok>=list.length*.85?3:ok>=list.length*.55?2:1,`${ok} encerts de ${list.length}`)};$('#n').appendChild(n)};
   $('#o').appendChild(b)});}
 show()}
home();
</script>
</body>
</html>
