<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genètica en joc 🧬</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2d42;--a:#6c5ce7;--b:#00b894;--c:#ff7675;--d:#fdcb6e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);text-align:center}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--a);color:#fff;font-weight:700;font-size:1.1rem}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.8rem;margin:.3em 0}
.btn{display:block;width:100%;margin:12px 0;padding:18px;font-size:1.25rem;font-weight:700;border:0;border-radius:18px;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.b1{background:var(--a)}.b2{background:var(--b)}.b3{background:var(--c)}.ex{background:#fff;border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.st{text-align:left;font-size:1.1rem;line-height:1.5;padding-left:1.3em}
.tip{background:#ffeaa7;border-radius:14px;padding:10px;font-weight:600;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.mini{background:#f1f2f6;border-radius:12px;padding:8px 10px;font-size:1rem;flex:1;min-width:130px}
.mini b{display:block;font-size:1.6rem}
.pt{border-collapse:collapse;margin:8px auto;font-size:1.15rem}
.pt td,.pt th{border:3px solid var(--a);padding:8px 12px}.pt th{background:#a29bfe;color:#fff}.pt td.h{background:#ffeaa7}
.b5{background:#e17055}.b6{background:#0984e3}.b4{background:#636e72;font-size:1rem;padding:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.card{min-height:96px;border-radius:14px;border:0;background:var(--a);color:#fff;font-size:2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;transition:transform .2s}
.card.open{background:var(--card);color:var(--ink);border:3px solid var(--a)}
.card.ok{background:#d5f5e3;border:3px solid var(--b);color:var(--ink)}
.card small{font-size:.85rem;line-height:1.15;font-weight:600}
.card .t{display:flex;flex-direction:column;gap:2px}
.q{background:var(--card);border-radius:18px;padding:18px;font-size:1.3rem;font-weight:700;margin:12px 0;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.opt{background:#fff;border:3px solid #dfe6e9;color:var(--ink)}
.opt.good{background:#d5f5e3;border-color:var(--b)}.opt.bad{background:#fadbd8;border-color:var(--c)}
.msg{min-height:3.2em;font-size:1.1rem;font-weight:600;margin:8px 0}
.bar{height:12px;background:#dfe6e9;border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--b);width:0;transition:width .3s}
.big{font-size:3.5rem;margin:8px}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fx span{position:absolute;top:-40px;font-size:2rem;animation:f 2s linear forwards}
@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<header><span>🧬 Genètica en joc</span><span id="pts">⭐ 0</span></header>
<main id="app"></main>
<div class="fx" id="fx"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
let pts=0;try{pts=+localStorage.getItem('gen_pts')||0}catch(e){}
function add(n){pts+=n;$('#pts').textContent='⭐ '+pts;try{localStorage.setItem('gen_pts',pts)}catch(e){}}
add(0);
const good=['Molt bé! 🎉','Crack! 💪','Genial! 🌟','Quina memòria! 🧠','Imparable! 🚀','Això és! 👏','Brutal! 🔥'];
const retry=['Gairebé! Cada error t\'ajuda a aprendre 💜','Cap problema, ara ja ho saps 😉','Els cracks també s\'equivoquen. Endavant! 💪','Bon intent! La propera cau 🍀'];
const praiseEnd=['Has fet una ronda sencera. Ets un/a campió/ona! 🏆','Tria: repetir o fer una pausa de 2 minuts 🧃','El teu cervell ha crescut una mica avui 🧠✨'];
function confetti(){const f=$('#fx');for(let i=0;i<24;i++){const s=document.createElement('span');s.textContent=rnd(['🎉','⭐','🧬','✨','🌟']);s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.6+'s';f.appendChild(s);setTimeout(()=>s.remove(),2800)}}
function home(){app.innerHTML=`<h1>Què juguem avui?</h1><p>Rondes curtes: 3-5 minuts. Cada encert suma estrelles ⭐</p>
<button class="btn b1" onclick="intro('memori')">🃏 Memori</button>
<button class="btn b2" onclick="intro('quiz')">❓ Repte de preguntes</button>
<button class="btn b3" onclick="intro('vf')">✅❌ Veritat o fals</button>
<button class="btn b5" onclick="intro('punnett')">🔲 Quadres de Punnett</button>
<button class="btn b6" onclick="intro('sang')">🩸 Pot donar sang?</button>
<button class="btn b4" onclick="study(['conceptes','mendel','altres','malalties','sexe','grups','rh'],home,'Acabat ✅')">📚 Temari complet</button>`}
function end(stars,extra){confetti();app.innerHTML=`<div class="big">${'⭐'.repeat(stars)}</div><h1>${rnd(good)}</h1><p>${extra||''}</p><p>${rnd(praiseEnd)}</p><button class="btn b1" onclick="home()">Tornar a l'inici</button>`}

/* MEMORI */
const SETS={
'🧬 Conceptes':[['🧬 Gen','Fragment d\'ADN amb informació d\'un caràcter'],['🔀 Al·lel','Cada versió d\'un gen'],['👁️ Fenotip','El que es veu: l\'aspecte'],['🧪 Genotip','Els al·lels que tens (ex: Aa)'],['💪 Dominant','Es nota sempre'],['😶 Recessiu','Només si en tens dos (aa)']],
'🩺 Malalties':[['🦄 Albinisme','Recessiu. Falta melanina'],['🫁 Fibrosi quística','Recessiva. Mucus als pulmons'],['💃 Huntington','Dominant. Ball de Sant Vito'],['✋ Polidactília','Dominant. Més dits'],['🎨 Daltonisme','Recessiu lligat a X. Verd/vermell'],['🩸 Hemofília','Recessiva lligada a X. Coagulació']],
'🅰️ Sang i sexe':[['🅰️ Grup A','Antigen A i anticòs anti-B'],['🅱️ Grup B','Antigen B i anticòs anti-A'],['🆎 Grup AB','Antígens A i B. Cap anticòs'],['⭕ Grup O','Cap antigen. Anti-A i anti-B'],['🤝 IAIB','Codominància: grup AB'],['👦👧 XY / XX','Home: XY. Dona: XX']]};
function memSel(){app.innerHTML='<h1>Tria un tema</h1>'+Object.keys(SETS).map((k,i)=>`<button class="btn b${i+1}" onclick="study(MEMPATH['${k}'],()=>mem('${k}'))">${k}</button>`).join('')+'<button class="btn b4" onclick="home()">⬅ Inici</button>'}
function mem(k){
 const cards=shuf(SETS[k].flatMap((p,i)=>[{id:i,h:`<span class="t"><span>${p[0].split(' ')[0]}</span><small>${p[0].split(' ').slice(1).join(' ')}</small></span>`},{id:i,h:`<small>${p[1]}</small>`}]));
 let first=null,lock=false,moves=0,found=0;
 app.innerHTML=`<h2>${k}</h2><p>Troba cada terme amb la seva definició</p><div class="bar"><i id="pb"></i></div><div class="grid" id="g"></div><div class="msg" id="m"></div><button class="btn b4" onclick="memSel()">⬅ Temes</button>`;
 const g=$('#g');
 cards.forEach(c=>{const b=document.createElement('button');b.className='card';b.textContent='❔';b.onclick=()=>{
  if(lock||b.classList.contains('open')||b.classList.contains('ok'))return;
  b.classList.add('open');b.innerHTML=c.h;
  if(!first){first={c,b};return}
  moves++;
  if(first.c.id===c.id){first.b.classList.add('ok');b.classList.add('ok');first=null;found++;add(10);$('#m').textContent=rnd(good);$('#pb').style.width=found/6*100+'%';
   if(found===6)setTimeout(()=>end(moves<=9?3:moves<=14?2:1,`Ho has fet en ${moves} intents`),600)}
  else{lock=true;$('#m').textContent=rnd(retry);const f=first;first=null;setTimeout(()=>{[f.b,b].forEach(x=>{x.classList.remove('open');x.textContent='❔'});lock=false},1100)}
 };g.appendChild(b)})}

/* PREGUNTES */
const Q=[
['Quina planta va fer servir Mendel?',['Pèsol','Tomaquera','Blat'],0,'El pèsol creix ràpid i és fàcil de creuar 🌱'],
['Un al·lel recessiu només es nota si tens…',['Un al·lel','Dos al·lels iguals (aa)','Cap al·lel'],1,'Recessiu = necessita dues còpies.'],
['El genotip Aa és…',['Homozigòtic','Heterozigòtic','Híbrid de sexe'],1,'Dos al·lels diferents = heterozigòtic.'],
['Primera llei: creues dues races pures. La F1 és…',['Tota uniforme','Meitat i meitat','Impossible de saber'],0,'Llei de la uniformitat dels híbrids.'],
['Quin és el genotip d\'una dona portadora d\'hemofília?',['XhXh','XHXh','XHY'],1,'Té un al·lel normal i un d\'hemofília.'],
['Una dona daltoniana té genotip…',['XdXd','XDXd','XdY'],0,'Ha de tenir dos al·lels d.'],
['Quin grup sanguini té genotip IAIB?',['A','O','AB'],2,'IA i IB són codominants: apareixen tots dos.'],
['Quin és el genotip del grup O?',['ii','IAi','IBIB'],0,'O és recessiu: ii.'],
['Probabilitat de tenir un fill o una filla?',['25%','50%','75%'],1,'50% fills i 50% filles.'],
['La malaltia de Huntington és…',['Recessiva','Dominant','Lligada a X'],1,'Dominant: amb un sol al·lel H ja apareix.'],
['L\'albinisme afecta a la síntesi de…',['Colesterol','Melanina','Hemoglobina'],1,'La melanina dóna color a pell, ulls i pèl.'],
['Codominància vol dir que l\'heterozigot…',['Barreja els al·lels','Mostra els dos al·lels','Mostra només un'],1,'Com les vaques ruanes 🐄'],
['Tercera llei: els caràcters no antagònics s\'hereten…',['Junts sempre','De manera independent','Només per via materna'],1,'Color i textura del pèsol són independents.'],
['Quan és perillós el factor Rh?',['Mare Rh+ i fill Rh-','Mare Rh- i fill Rh+ (2n embaràs)','Mai'],1,'Per això hi ha una injecció preventiva 💉'],
['A la segona llei, els al·lels es separen als…',['Gàmetes','Ronyons','Cromosomes X'],0,'Segregació dels al·lels als gàmetes.'],
['Quins anticossos té el grup AB?',['Anti-A','Anti-B','Cap']
,2,'Té els dos antígens, així que no fabrica anticossos.']];
const V=[
['Els homes tenen cromosomes XX.',1,'Home XY, dona XX.'],['L\'albinisme és una malaltia dominant.',1,'És recessiva.'],['Huntington és causada per un al·lel dominant.',0,'Correcte, es manifesta entre els 30 i 50 anys.'],
['El grup O té antigen A.',1,'El grup O no té cap antigen.'],['IA i IB són codominants.',0,'Sí, per això hi ha el grup AB.'],['Hi ha un 50% de probabilitat de tenir filla.',0,'Un 50% fills i 50% filles.'],
['Una dona XhXh és hemofílica.',0,'Té dos al·lels recessius.'],['Mendel va fer servir pèsols.',0,'Sí! 🌱'],['El Rh positiu és recessiu.',1,'El positiu és dominant.'],
['La polidactília dóna més dits i és dominant.',0,'Exacte ✋'],['Mendel va estudiar 7 caràcters del pèsol.',0,'Sí, d\'1 o 2 en cada creuament.'],['El daltonisme és dominant.',1,'És recessiu i lligat a X.']].map(v=>[v[0],['Veritat ✅','Fals ❌'],v[1],v[2]]);
function quiz(){run(shuf(Q).slice(0,6))}
function vf(){run(shuf(V).slice(0,8))}
function run(list){
 let i=0,ok=0,streak=0;
 function show(){
  const [q,o,a,e]=list[i];let done=false;
  app.innerHTML=`<div class="bar"><i style="width:${i/list.length*100}%"></i></div><p>Pregunta ${i+1} de ${list.length} · 🔥 ${streak}</p><div class="q">${q}</div><div id="o"></div><div class="msg" id="m"></div><div id="n"></div>`;
  o.map((t,k)=>[t,k]).forEach(([t,k])=>{const b=document.createElement('button');b.className='btn opt';b.textContent=t;b.onclick=()=>{
   if(done)return;done=true;
   if(k===a){b.classList.add('good');ok++;streak++;add(10+(streak>=3?5:0));$('#m').textContent=rnd(good)+(streak>=3?' Ratxa x'+streak+'!':'')+' '+e}
   else{b.classList.add('bad');streak=0;[...$('#o').children][a].classList.add('good');$('#m').textContent=rnd(retry)+' '+e}
   const n=document.createElement('button');n.className='btn b1';n.textContent=i+1<list.length?'Següent ➡':'Veure resultat 🏁';n.onclick=()=>{i++;i<list.length?show():end(ok>=list.length*.85?3:ok>=list.length*.55?2:1,`${ok} encerts de ${list.length}`)};$('#n').appendChild(n)};
   $('#o').appendChild(b)});}
 show()}
function punnett(){
 const T=[['el color de la llavor del pèsol','groc','verd'],['la textura del pèsol','llis','rugós'],['la pigmentació (albinisme)','pigmentat','albí'],['la polidactília','amb més dits','amb 5 dits']];
 const C=[['AA','aa'],['Aa','Aa'],['Aa','aa'],['AA','Aa'],['aa','aa'],['Aa','Aa']];
 const list=[];
 for(let i=0;i<6;i++){
  const t=rnd(T),[p,q]=rnd(C),want=Math.random()<.5,kids=[];
  for(const x of p)for(const y of q)kids.push([x,y].sort().join(''));
  const dom=k=>k.includes('A'),n=kids.filter(k=>want?dom(k):!dom(k)).length*25;
  const opts=shuf(shuf([0,25,50,75,100].filter(v=>v!==n)).slice(0,2).concat(n));
  list.push([`Creuem ${p} × ${q} (${t[0]}: «${t[1]}» és dominant sobre «${t[2]}»). Quin % de fills serà ${want?t[1]:t[2]}?`,opts.map(v=>v+'%'),opts.indexOf(n),`Els fills possibles són: ${kids.join(', ')}.`])}
 run(list)}
function sang(){
 const G={A:['A'],B:['B'],AB:['A','B'],O:[]},names=Object.keys(G),list=[];
 for(let i=0;i<8;i++){
  const d=rnd(names),r=rnd(names),ok=G[d].every(x=>G[r].includes(x));
  const anti=['A','B'].filter(x=>!G[r].includes(x)).map(x=>'anti-'+x).join(' i ')||'cap anticòs';
  list.push([`Una persona de grup ${r} pot rebre sang de grup ${d}?`,['Sí ✅','No ❌'],ok?0:1,ok?`Sí: el grup ${r} té ${anti}, que no ataquen la sang ${d}.`:`No: el grup ${r} té ${anti} i atacaria els antígens del grup ${d}.`])}
 run(list)}
const HELP={
memori:`<h2>🃏 Com es juga al Memori</h2>
<div class="ex"><div class="row"><div class="mini"><b>🧬</b>Gen</div><div class="mini"><b>↔️</b>parella</div><div class="mini"><b>📝</b>Fragment d'ADN amb informació d'un caràcter</div></div></div>
<ol class="st"><li>Gira <b>dues cartes</b>.</li><li>Una porta un <b>terme amb dibuix</b> i l'altra la seva <b>definició</b>.</li><li>Si encaixen, es queden obertes ✅</li><li>Si no, es tapen: <b>recorda on eren</b>.</li></ol>
<div class="tip">💡 Truc: llegeix una definició i pensa «quin dibuix li va?» abans de buscar la parella.</div>`,
quiz:`<h2>❓ Repte de preguntes</h2>
<div class="ex"><div class="row">
<div class="mini"><b>💪</b>Dominant<br>Aa ja es nota</div>
<div class="mini"><b>😶</b>Recessiu<br>cal aa</div>
<div class="mini"><b>👦👧</b>Home XY<br>Dona XX</div>
<div class="mini"><b>🩸</b>A i B dominen<br>O és ii</div></div></div>
<ol class="st"><li><b>Llegeix</b> la pregunta sense pressa.</li><li><b>Descarta</b> les respostes que no tenen sentit.</li><li>Tria! Si falles, t'expliquem el perquè 💜</li></ol>
<div class="tip">💡 Truc: si dubtes, escriu el genotip en un paper (Aa, aa, XY…) i raona amb ell.</div>`,
vf:`<h2>✅❌ Veritat o fals</h2>
<div class="ex"><div class="row"><div class="mini"><b>🚩</b>Paraules trampa: <i>sempre, mai, només</i></div><div class="mini"><b>🔁</b>Canvia dominant ↔ recessiu i veuràs si és fals</div></div></div>
<ol class="st"><li>Llegeix l'afirmació.</li><li>Pensa en el <b>dibuix o la regla</b> que has vist (dominant, XY, antigen…).</li><li>Si encaixa del tot → <b>Veritat</b>. Si hi ha un detall que no quadra → <b>Fals</b>.</li></ol>
<div class="tip">💡 Recorda: Huntington i polidactília = dominants. Albinisme, fibrosi, daltonisme i hemofília = recessives.</div>`,
punnett:`<h2>🔲 El quadre de Punnett</h2>
<p>Pare <b>Aa</b> (dona A o a) × mare <b>Aa</b> (dona A o a). 🟡 groc = A dominant · 🟢 verd = aa</p>
<table class="pt"><tr><th>×</th><th>A</th><th>a</th></tr><tr><th>A</th><td class="h">AA 🟡</td><td class="h">Aa 🟡</td></tr><tr><th>a</th><td class="h">Aa 🟡</td><td>aa 🟢</td></tr></table>
<ol class="st"><li>Posa els <b>gàmetes del pare</b> dalt i els de la <b>mare</b> a l'esquerra.</li><li>Omple cada casella ajuntant una lletra de dalt i una de l'esquerra.</li><li>Hi ha <b>4 caselles</b>: cadascuna val <b>25%</b>.</li><li>Compta les caselles del fenotip que et demanen. Aquí: 🟡 3 de 4 = <b>75%</b>, 🟢 1 de 4 = <b>25%</b>.</li></ol>
<div class="tip">💡 Truc: amb una A majúscula ja es veu el dominant. Només aa mostra el recessiu.</div>`,
sang:`<h2>🩸 Pot donar sang?</h2>
<table class="pt"><tr><th>Grup</th><th>🔴 Antigen<br>(a la cèl·lula)</th><th>💧 Anticòs<br>(al plasma)</th></tr>
<tr><td>A</td><td>A</td><td>anti-B</td></tr><tr><td>B</td><td>B</td><td>anti-A</td></tr><tr><td>AB</td><td>A i B</td><td>cap</td></tr><tr><td>O</td><td>cap</td><td>anti-A i anti-B</td></tr></table>
<ol class="st"><li>Mira els <b>antígens del donant</b> 🔴.</li><li>Mira els <b>anticossos del receptor</b> 💧.</li><li>💥 Hi ha problema si un anticòs troba el seu antigen (anti-A + antigen A).</li></ol>
<div class="ex">Exemple: receptor <b>A</b> (anti-B) i donant <b>B</b> (antigen B) → 💥 no pot.<br>⭕ O no té antígens: <b>dona a tothom</b>. 🆎 AB no té anticossos: <b>rep de tothom</b>.</div>`};
const START={memori:memSel,quiz,vf,punnett,sang};
const PAGES={
conceptes:`<h2>📖 1. Conceptes bàsics</h2>
<div class="ex"><div class="row">
<div class="mini"><b>🧬</b>Gen<br>Fragment d'ADN amb la informació d'un caràcter</div>
<div class="mini"><b>🔀</b>Al·lel<br>Cada versió d'un gen (A, a)</div></div>
<div class="row"><div class="mini"><b>👁️</b>Fenotip<br>El que es veu (groc, verd…)</div>
<div class="mini"><b>🧪</b>Genotip<br>Els al·lels que tens (AA, Aa, aa)</div></div>
<div class="row"><div class="mini"><b>💪</b>Dominant (A)<br>Es nota sempre, amb 1 còpia</div>
<div class="mini"><b>😶</b>Recessiu (a)<br>Només es nota amb 2 còpies (aa)</div></div></div>
<p class="tip">AA i aa = <b>homozigòtic</b> (iguals). Aa = <b>heterozigòtic</b> (diferents).</p>
<p><b>Genètica</b>: ciència de l'herència biològica (passar caràcters de pares a fills). Caràcter <b>hereditari</b>: es transmet. Caràcter <b>adquirit</b>: es guanya durant la vida i no es transmet.</p>`,
mendel:`<h2>🌱 2. Les lleis de Mendel</h2>
<p>Va triar el <b>pèsol</b>: fàcil de cultivar, creix ràpid, té varietats fàcils d'observar i es pot autopol·linitzar o creuar. Va fer servir <b>races pures</b>, va estudiar <b>7 caràcters</b> (d'1 o 2 en cada creuament), va seguir <b>diverses generacions</b> i va analitzar les dades amb números.</p>
<div class="ex"><b>1a llei: uniformitat (F1)</b><br>AA 🟡 × aa 🟢 → <b>tots Aa 🟡</b><br>Dues races pures → tota la descendència és igual.</div>
<div class="ex"><b>2a llei: segregació (F2)</b><br>Aa × Aa → AA 🟡, Aa 🟡, Aa 🟡, aa 🟢<br>Els al·lels se separen als <b>gàmetes</b>. Surten <b>75% grocs i 25% verds</b>.</div>
<div class="ex"><b>3a llei: independència</b><br>Color (groc/verd) i pell (llis/rugós) es transmeten <b>cadascun pel seu compte</b>. Els caràcters no antagònics s'hereten independentment.</div>`,
altres:`<h2>🎨 3. Herències no dominants</h2>
<div class="ex"><b>Herència intermèdia</b><br>🌺 vermella × ⚪ blanca → 🌸 <b>rosa</b><br>L'heterozigot és una <b>barreja</b> dels pares.</div>
<div class="ex"><b>Codominància</b><br>🐄 Vaca <b>ruana</b> (shorthorn): té pèl vermell <b>i</b> blanc alhora.<br>L'heterozigot mostra <b>els dos al·lels a la vegada</b>.</div>`,
malalties:`<h2>🩺 4. Malalties genètiques</h2>
<table class="pt"><tr><th>Malaltia</th><th>Al·lel</th><th>Què passa</th></tr>
<tr><td>🦄 Albinisme</td><td>Recessiu</td><td>Falta melanina (pell, ulls, pèl)</td></tr>
<tr><td>🫁 Fibrosi quística</td><td>Recessiu</td><td>Mucus espès a pulmons i digestiu</td></tr>
<tr><td>💃 Huntington</td><td>Dominant (H)</td><td>Moviments exagerats; apareix als 30-50 anys</td></tr>
<tr><td>🫀 Hipercolesterolèmia</td><td>Dominant</td><td>Colesterol alt, infarts joves</td></tr>
<tr><td>✋ Polidactília</td><td>Dominant</td><td>Més dits a mans o peus</td></tr>
<tr><td>🐑 Ovelles Ancon</td><td>Dominant</td><td>Potes curtes i tortes</td></tr></table>
<p class="tip">💡 <b>Dominant</b>: amb un sol al·lel ja apareix. <b>Recessiu</b>: calen dos (aa).</p>`,
sexe:`<h2>👦👧 5. Herència del sexe</h2>
<div class="ex">Dona <b>XX</b> · Home <b>XY</b><br>Probabilitat de fill o filla: <b>50% / 50%</b><br>Els cromosomes X i Y són els <b>heterocromosomes</b> (sexuals).</div>
<p><b>Herència lligada al sexe</b>: gens situats al cromosoma X. <b>Hemofília</b> (coagulació de la sang) i <b>daltonisme</b> (no distingir verd/vermell) són <b>recessives</b> i van a l'X.</p>
<table class="pt"><tr><th>Genotip</th><th>Hemofília (H/h)</th><th>Daltonisme (D/d)</th></tr>
<tr><td>XᴴY / XᴰY</td><td>Home normal</td><td>Home normal</td></tr>
<tr><td>XʰY / XᵈY</td><td>Home malalt</td><td>Home daltònic</td></tr>
<tr><td>XᴴXᴴ / XᴰXᴰ</td><td>Dona normal</td><td>Dona normal</td></tr>
<tr><td>XᴴXʰ / XᴰXᵈ</td><td>Dona <b>portadora</b></td><td>Dona <b>portadora</b></td></tr>
<tr><td>XʰXʰ / XᵈXᵈ</td><td>Dona malalta</td><td>Dona daltònica</td></tr></table>
<p class="tip">💡 L'home té un sol X: si l'al·lel recessiu hi és, ja es nota.</p>`,
grups:`<h2>🩸 6. Grups sanguinis (ABO)</h2>
<p>Hi ha <b>3 al·lels</b> (Iᴬ, Iᴮ, i): és l'<b>al·lelisme múltiple</b>. Iᴬ i Iᴮ <b>dominen sobre i</b>, i són <b>codominants entre ells</b>.</p>
<table class="pt"><tr><th>Grup</th><th>Genotip</th><th>🔴 Antigen</th><th>💧 Anticòs</th></tr>
<tr><td>A</td><td>IᴬIᴬ, Iᴬi</td><td>A</td><td>anti-B</td></tr>
<tr><td>B</td><td>IᴮIᴮ, Iᴮi</td><td>B</td><td>anti-A</td></tr>
<tr><td>AB</td><td>IᴬIᴮ</td><td>A i B</td><td>cap</td></tr>
<tr><td>O</td><td>ii</td><td>cap</td><td>anti-A i anti-B</td></tr></table>
<p>Els <b>antígens</b> estan a la membrana dels glòbuls vermells. Els <b>anticossos</b> són al plasma i rebutgen antígens que no són propis.</p>`,
rh:`<h2>➕ 7. El factor Rh</h2>
<div class="ex">Rh <b>positiu</b> (++ o +-) domina sobre Rh <b>negatiu</b> (--).</div>
<div class="ex">⚠️ Perill: mare <b>Rh−</b>, pare <b>Rh+</b> i fill <b>Rh+</b>, sobretot al <b>2n embaràs</b>.<br>💉 Es previn amb una injecció (vacuna).</div>`};
